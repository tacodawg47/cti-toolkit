<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CTI Toolkit{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1419; color: #e6e6e6; }
    header { background: #1a2332; padding: 12px 20px; border-bottom: 1px solid #2a3a4a; }
    header a { color: #6db3f2; text-decoration: none; margin-right: 18px; }
    header a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    /* Pages with wide tables (vulnerability intelligence) opt in to more room. */
    main.wide { max-width: 1280px; }
    h1 { font-size: 22px; }
    input[type=text], textarea { width: 100%; padding: 10px; font-size: 16px; background: #0f1419;
      border: 1px solid #2a3a4a; color: #e6e6e6; border-radius: 6px; box-sizing: border-box; }
    textarea { font-family: ui-monospace, monospace; font-size: 14px; }
    input[type=file] { color: #e6e6e6; margin-top: 6px; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px;
      background: #2a3a4a; color: #c7d2dc; margin-left: 6px; }
    .badge-defanged { background: #4c1d95; color: #e9d5ff; }
    .badge-popular, .badge-private { background: #374151; color: #9ca3af; }
    .inline-form { display: inline; }
    button.small { padding: 3px 10px; font-size: 13px; margin: 0; }
    .dim td { color: #9ca3af; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid #2a3a4a; margin-bottom: 16px; }
    .tabs a { color: #9ca3af; text-decoration: none; padding: 8px 14px; border: 1px solid transparent;
      border-bottom: 0; border-radius: 6px 6px 0 0; }
    .tabs a:hover { color: #e6e6e6; }
    .tabs a.active { color: #e6e6e6; background: #1a2332; border-color: #2a3a4a; }
    .pri { display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
    .pri-P1 { background: #7f1d1d; color: #fecaca; }
    .pri-P2 { background: #7c2d12; color: #fed7aa; }
    .pri-P3 { background: #713f12; color: #fde68a; }
    .pri-P4 { background: #1e3a5f; color: #bfdbfe; }
    .pri-P5 { background: #374151; color: #d1d5db; }
    .badge-kev { background: #7f1d1d; color: #fecaca; }
    .badge-ransom { background: #4c0519; color: #fecdd3; }
    .badge-stack { background: #14532d; color: #bbf7d0; }
    .card h2 { font-size: 20px; }
    a { color: #6db3f2; }
    .barwrap { display: inline-block; width: 70px; height: 8px; background: #0f1419; border-radius: 4px;
      vertical-align: middle; margin-left: 6px; }
    .bar { display: block; height: 8px; background: linear-gradient(90deg, #fbbf24, #f87171); border-radius: 4px; }
    svg text { fill: #9ca3af; }
    .legend { font-size: 12px; color: #9ca3af; margin: 6px 0 0; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
    .filterbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 10px; font-size: 13px; color: #9ca3af; }
    .filterbar select, .filterbar input[type=search] { background: #0f1419; color: #e6e6e6; border: 1px solid #2a3a4a; border-radius: 4px; padding: 3px 6px; font-size: 13px; }
    .filterbar button.small { margin: 0; }
    .sortlink { color: inherit; text-decoration: none; }
    .sortlink:hover { text-decoration: underline; }
    ul.plain { list-style: none; margin: 0; padding: 0; }
    ul.plain li { padding: 1px 0; }
    .pager { margin: 8px 0 0; }
    .viewstrip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .viewcount { background: #1a2332; border: 1px solid #2a3a4a; border-radius: 6px; padding: 6px 12px;
      text-decoration: none; color: #c7d2dc; }
    .viewcount strong { color: #e6e6e6; margin-right: 4px; }
    .tagline { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px 4px; text-decoration: none; }
    .tagline .badge { margin: 0; }
    /* The CVE column: the ID stays on one line, its source badges wrap under it. */
    td.cvecell { min-width: 150px; max-width: 260px; }
    td.cvecell > a:first-child { white-space: nowrap; }
    /* A table wider than its card scrolls inside the card instead of spilling over the edge. */
    .tablescroll { overflow-x: auto; }
    /* Sort, filter and page links end in #t-<table>; leave room above the table's heading. */
    .tablewrap, [id^="t-"] { scroll-margin-top: 48px; }
    /* The vendor picker: a drop-down of tick boxes, built from <details> so it needs no script. */
    details.multi { position: relative; }
    details.multi > summary { cursor: pointer; list-style: none; background: #0f1419; color: #e6e6e6;
      border: 1px solid #2a3a4a; border-radius: 4px; padding: 3px 8px; }
    details.multi > summary::after { content: " ▾"; color: #9ca3af; }
    details.multi[open] { z-index: 5; }
    details.multi > .multi-list { position: absolute; top: 28px; left: 0; z-index: 5; background: #1a2332;
      border: 1px solid #2a3a4a; border-radius: 6px; padding: 8px; max-height: 280px; min-width: 240px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    details.multi > .multi-list label { white-space: nowrap; color: #e6e6e6; }
    details.multi .apply { position: sticky; bottom: 0; margin-top: 6px; align-self: flex-start; }
    .cvetitle { font-size: 16px; margin: 0 0 6px; color: #c7d2dc; }
    /* Key figures under a CVE's title: small label above each value. */
    .facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 12px 0; padding: 10px 0;
      border-top: 1px solid #2a3a4a; border-bottom: 1px solid #2a3a4a; }
    .facts > div > small:first-child { display: block; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
    .sub { font-size: 12px; color: #9ca3af; font-weight: normal; margin: -4px 0 8px; }
    button { padding: 10px 18px; font-size: 16px; background: #2563eb; color: #fff;
      border: 0; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .card { background: #1a2332; border: 1px solid #2a3a4a; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .verdict-malicious { color: #f87171; font-weight: bold; }
    .verdict-suspicious { color: #fbbf24; font-weight: bold; }
    .verdict-clean { color: #4ade80; font-weight: bold; }
    .verdict-unknown, .verdict-error { color: #9ca3af; font-weight: bold; }
    .verdict-inconclusive { color: #c4b5fd; font-weight: bold; }
    .verdict-unavailable { color: #fbbf24; font-weight: bold; }
    .err { color: #fbbf24; }
    .muted { color: #9ca3af; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a3a4a; font-size: 14px; vertical-align: top; }
    code { background: #0f1419; padding: 2px 6px; border-radius: 4px; }
    .ok { color: #4ade80; } .no { color: #9ca3af; }
    small { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <a href="/">Enrichment</a>
    <a href="/extract">Extract IOCs</a>
    <a href="/vulnerability-intelligence">Vulnerability Intelligence</a>
    <a href="/health">Health</a>
  </header>
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
