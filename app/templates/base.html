<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CTI Toolkit{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1419; color: #e6e6e6; }
    header { background: #1a2332; padding: 12px 20px; border-bottom: 1px solid #2a3a4a; }
    header a { color: #6db3f2; text-decoration: none; margin-right: 18px; }
    header a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; }
    input[type=text], textarea { width: 100%; padding: 10px; font-size: 16px; background: #0f1419;
      border: 1px solid #2a3a4a; color: #e6e6e6; border-radius: 6px; box-sizing: border-box; }
    textarea { font-family: ui-monospace, monospace; font-size: 14px; }
    input[type=file] { color: #e6e6e6; margin-top: 6px; }
    .badge { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px;
      background: #2a3a4a; color: #c7d2dc; margin-left: 6px; }
    .badge-defanged { background: #4c1d95; color: #e9d5ff; }
    .badge-popular, .badge-private { background: #374151; color: #9ca3af; }
    .inline-form { display: inline; }
    button.small { padding: 3px 10px; font-size: 13px; margin: 0; }
    .dim td { color: #9ca3af; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid #2a3a4a; margin-bottom: 16px; }
    .tabs a { color: #9ca3af; text-decoration: none; padding: 8px 14px; border: 1px solid transparent;
      border-bottom: 0; border-radius: 6px 6px 0 0; }
    .tabs a:hover { color: #e6e6e6; }
    .tabs a.active { color: #e6e6e6; background: #1a2332; border-color: #2a3a4a; }
    .pri { display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
    .pri-P1 { background: #7f1d1d; color: #fecaca; }
    .pri-P2 { background: #7c2d12; color: #fed7aa; }
    .pri-P3 { background: #713f12; color: #fde68a; }
    .pri-P4 { background: #1e3a5f; color: #bfdbfe; }
    .pri-P5 { background: #374151; color: #d1d5db; }
    .badge-kev { background: #7f1d1d; color: #fecaca; }
    .badge-ransom { background: #4c0519; color: #fecdd3; }
    .badge-stack { background: #14532d; color: #bbf7d0; }
    .card h2 { font-size: 20px; }
    a { color: #6db3f2; }
    button { padding: 10px 18px; font-size: 16px; background: #2563eb; color: #fff;
      border: 0; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .card { background: #1a2332; border: 1px solid #2a3a4a; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .verdict-malicious { color: #f87171; font-weight: bold; }
    .verdict-suspicious { color: #fbbf24; font-weight: bold; }
    .verdict-clean { color: #4ade80; font-weight: bold; }
    .verdict-unknown, .verdict-error { color: #9ca3af; font-weight: bold; }
    .verdict-inconclusive { color: #c4b5fd; font-weight: bold; }
    .verdict-unavailable { color: #fbbf24; font-weight: bold; }
    .err { color: #fbbf24; }
    .muted { color: #9ca3af; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a3a4a; font-size: 14px; vertical-align: top; }
    code { background: #0f1419; padding: 2px 6px; border-radius: 4px; }
    .ok { color: #4ade80; } .no { color: #9ca3af; }
    small { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <a href="/">Enrichment</a>
    <a href="/extract">Extract IOCs</a>
    <a href="/vulnerability-intelligence">Vulnerability Intelligence</a>
    <a href="/health">Health</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
